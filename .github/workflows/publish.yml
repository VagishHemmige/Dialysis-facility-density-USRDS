# Renders the website and publishes it to the gh-pages branch, which GitHub
# Pages serves. Runs on every push to main, or by hand from the Actions tab.
# On a pull request it only renders, as a check that every page still builds.
# Based on the publish.yml in the r-analysis-workflow plugin, Quarto's GitHub
# Pages guide and quarto-dev/quarto-actions.
#
# Unlike the plugin's own site, these pages run R: the hidden
# knitr::read_chunk() imports and the helpers in quarto/_site_functions.R.
# They never run analysis code (AGENTS.md, "Quarto website"), and this machine
# has no USRDS data. A failed render publishes nothing, so the last good site
# stays live.

on:
  workflow_dispatch:
  push:
    branches: main
  pull_request:
    branches: main

name: Publish website

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      # The original R Markdown page contains non-ASCII characters such as ≤
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Pinned so a new Quarto release can't change the site unseen.
          # The version that rendered the site in Positron; to move to a newer
          # version, change this line in a pull request.
          version: 1.10.18

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Only what the pages run: knitr and rmarkdown for the R chunks, and the
      # packages quarto/_site_functions.R calls with ::, plus yaml for the
      # cross-reference check. Current CRAN versions.
      - name: Install the R packages the pages use
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::diffobj
            any::dplyr
            any::htmltools
            any::purrr
            any::stringr
            any::tibble
            any::yaml

      # The functions page and the method pages must link each other as the
      # code says (AGENTS.md, "Quarto website"); see the script for how to fix
      - name: Check function cross-references
        run: Rscript tests/check-crosslinks.R check

      - name: Render (pull requests only)
        if: github.event_name == 'pull_request'
        uses: quarto-dev/quarto-actions/render@v2

      - name: Render and publish to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
