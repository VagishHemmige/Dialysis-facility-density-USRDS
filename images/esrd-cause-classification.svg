<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 670" width="1210" height="670" role="img" aria-labelledby="fig-title fig-desc" font-family="Helvetica, Arial, sans-serif">
  <title id="fig-title">How the cause codes are classified</title>
  <desc id="fig-desc">The 445 public USRDS cause codes, with the same prompt, go from R through ellmer to five models as separate requests: three cloud models (OpenAI GPT, Anthropic Claude, Google Gemini) that vote, and two local models run through Ollama (Qwen, Llama) that are compared but do not vote. Each model's replies come back through ellmer as its own dataset of code, category and reason. In the three cloud datasets, code 2718Z (oxalate nephropathy or oxalosis) is Other for GPT and Claude and Hereditary for Gemini, while E1122 (Diabetes) and Q612 (Hereditary) are unanimous. The cloud answers are checked and a category is accepted when two of three agree, so 2718Z is Other; the mapping has 423 unanimous codes, 22 accepted two of three and none left for review. The local models' answers are summarised: Qwen answered 295 of 445 codes and matched the vote on 272; Llama answered 412 and matched on 355.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b8a6b"/></marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker>
  </defs>
  <style>
    .t { fill:#1c2b3a; }
    .b { font-weight:700; }
    .s { font-size:11.5px; }
    .m { font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size:11px; }
    .g { fill:#5b6675; }
    .box { fill:#ffffff; stroke:#c3ccd8; stroke-width:1.2; }
    .send { stroke:#2f6db5; stroke-width:2; fill:none; marker-end:url(#ab); }
    .ret { stroke:#1b8a6b; stroke-width:2; fill:none; marker-end:url(#ag); }
    .flow { stroke:#5b6675; stroke-width:1.8; fill:none; marker-end:url(#ak); }
    .line { stroke:#5b6675; stroke-width:1.8; fill:none; }
    .odd { fill:#b0411c; font-weight:700; }
  </style>

  <rect width="1210" height="670" fill="#ffffff"/>

  <!-- ===== Left column: inputs ===== -->
  <rect x="20" y="44" width="190" height="104" rx="8" fill="#f4f6f9" stroke="#c3ccd8"/>
  <text x="34" y="68" class="t b" font-size="14">Public code list</text>
  <text x="34" y="88" class="t s">445 USRDS cause codes</text>
  <text x="34" y="104" class="t s">with descriptions</text>
  <text x="34" y="120" class="g s">128 ICD-10-CM · 317 older</text>
  <text x="34" y="138" class="t s b">No patient data</text>

  <path d="M115,148 L115,170" class="flow"/>

  <rect x="20" y="174" width="190" height="84" rx="8" fill="#f4f6f9" stroke="#c3ccd8"/>
  <text x="34" y="198" class="t b" font-size="14">Same prompt for all</text>
  <text x="34" y="216" class="t s">six categories defined</text>
  <text x="34" y="232" class="t s">in words; codes added</text>
  <text x="34" y="248" class="t s">in batches</text>

  <path d="M210,220 L236,220" class="flow"/>

  <!-- ===== Model groups ===== -->
  <rect x="238" y="10" width="570" height="122" rx="10" fill="#eef6f1" stroke="#a9d1bb"/>
  <text x="252" y="31" class="t b" font-size="12.5">CLOUD SERVICES · THESE THREE VOTE</text>
  <rect x="822" y="10" width="382" height="122" rx="10" fill="#f3f0f8" stroke="#c9bfdc"/>
  <text x="836" y="31" class="t b" font-size="12.5">LOCAL, THROUGH OLLAMA · COMPARED, NO VOTE</text>

  <!-- model boxes: columns at 250, 438, 626, 834, 1022 (width 170) -->
  <g>
    <rect x="250" y="42" width="170" height="78" rx="7" class="box"/>
    <text x="262" y="64" class="t b" font-size="14">OpenAI GPT</text>
    <text x="262" y="83" class="t m">gpt-6.1-terra</text>
    <text x="262" y="104" class="g s">batches of 100</text>

    <rect x="438" y="42" width="170" height="78" rx="7" class="box"/>
    <text x="450" y="64" class="t b" font-size="14">Anthropic Claude</text>
    <text x="450" y="83" class="t m">claude-sonnet-5-5</text>
    <text x="450" y="104" class="g s">batches of 100</text>

    <rect x="626" y="42" width="170" height="78" rx="7" class="box"/>
    <text x="638" y="64" class="t b" font-size="14">Google Gemini</text>
    <text x="638" y="83" class="t m">gemini-3.8-flash</text>
    <text x="638" y="104" class="g s">batches of 25</text>

    <rect x="834" y="42" width="170" height="78" rx="7" class="box"/>
    <text x="846" y="64" class="t b" font-size="14">Alibaba Qwen</text>
    <text x="846" y="83" class="t m">qwen3.5:9b</text>
    <text x="846" y="104" class="g s">batches of 25</text>

    <rect x="1022" y="42" width="170" height="78" rx="7" class="box"/>
    <text x="1034" y="64" class="t b" font-size="14">Meta Llama</text>
    <text x="1034" y="83" class="t m">llama3.1:8b</text>
    <text x="1034" y="104" class="g s">batches of 5</text>
  </g>

  <!-- request (up) and reply (down) pairs, one per model -->
  <g>
    <path d="M321,188 L321,124" class="send"/><path d="M349,124 L349,186" class="ret"/>
    <path d="M509,188 L509,124" class="send"/><path d="M537,124 L537,186" class="ret"/>
    <path d="M697,188 L697,124" class="send"/><path d="M725,124 L725,186" class="ret"/>
    <path d="M905,188 L905,124" class="send"/><path d="M933,124 L933,186" class="ret"/>
    <path d="M1093,188 L1093,124" class="send"/><path d="M1121,124 L1121,186" class="ret"/>
  </g>
  <text x="246" y="162" class="g s" font-size="10.5">5 separate</text>
  <text x="246" y="175" class="g s" font-size="10.5">requests</text>

  <!-- ===== ellmer bar ===== -->
  <rect x="238" y="190" width="966" height="60" rx="10" fill="#eaf1fb" stroke="#9fb9dc"/>
  <text x="256" y="227" class="t b" font-size="20">R · ellmer</text>
  <text x="380" y="214" class="t s">One R interface to all five models. Each batch is a new conversation, so one batch cannot influence the next.</text>
  <text x="380" y="234" class="t s">Structured output: every reply comes back as a dataset of code, category and reason, the category limited to the six names.</text>

  <!-- replies out of ellmer, one dataset per model -->
  <g>
    <path d="M335,250 L335,284" class="ret"/>
    <path d="M523,250 L523,284" class="ret"/>
    <path d="M711,250 L711,284" class="ret"/>
    <path d="M919,250 L919,284" class="ret"/>
    <path d="M1107,250 L1107,284" class="ret"/>
  </g>
  <text x="246" y="272" class="g s" font-size="10.5">5 datasets</text>

  <!-- ===== Five returned datasets ===== -->
  <!-- cloud cards -->
  <g>
    <!-- GPT -->
    <rect x="250" y="288" width="170" height="134" rx="7" class="box"/>
    <text x="262" y="308" class="t b" font-size="12.5">GPT dataset</text>
    <text x="262" y="326" class="g" font-size="10">code</text><text x="318" y="326" class="g" font-size="10">category</text>
    <text x="262" y="348" class="t m">E1122</text><text x="318" y="348" class="t s">Diabetes</text>
    <text x="262" y="372" class="t m">Q612</text><text x="318" y="372" class="t s">Hereditary</text>
    <rect x="254" y="382" width="162" height="26" rx="4" fill="#e6ebf2"/>
    <text x="262" y="399" class="t m b">2718Z</text><text x="318" y="399" class="t s">Other</text>

    <!-- Claude -->
    <rect x="438" y="288" width="170" height="134" rx="7" class="box"/>
    <text x="450" y="308" class="t b" font-size="12.5">Claude dataset</text>
    <text x="450" y="326" class="g" font-size="10">code</text><text x="506" y="326" class="g" font-size="10">category</text>
    <text x="450" y="348" class="t m">E1122</text><text x="506" y="348" class="t s">Diabetes</text>
    <text x="450" y="372" class="t m">Q612</text><text x="506" y="372" class="t s">Hereditary</text>
    <rect x="442" y="382" width="162" height="26" rx="4" fill="#e6ebf2"/>
    <text x="450" y="399" class="t m b">2718Z</text><text x="506" y="399" class="t s">Other</text>

    <!-- Gemini -->
    <rect x="626" y="288" width="170" height="134" rx="7" class="box"/>
    <text x="638" y="308" class="t b" font-size="12.5">Gemini dataset</text>
    <text x="638" y="326" class="g" font-size="10">code</text><text x="694" y="326" class="g" font-size="10">category</text>
    <text x="638" y="348" class="t m">E1122</text><text x="694" y="348" class="t s">Diabetes</text>
    <text x="638" y="372" class="t m">Q612</text><text x="694" y="372" class="t s">Hereditary</text>
    <rect x="630" y="382" width="162" height="26" rx="4" fill="#e6ebf2" stroke="#b0411c" stroke-width="1.6"/>
    <text x="638" y="399" class="t m b">2718Z</text><text x="694" y="399" class="s odd">Hereditary</text>
  </g>

  <!-- local cards: summaries from references/esrd-cause-local-models.csv -->
  <g>
    <rect x="834" y="288" width="170" height="134" rx="7" class="box" fill="#fbfaFd"/>
    <text x="846" y="308" class="t b" font-size="12.5">Qwen dataset</text>
    <text x="846" y="326" class="g" font-size="10">summary of its 445 codes</text>
    <text x="846" y="348" class="t s">295 answered</text>
    <text x="846" y="368" class="t s">150 left unanswered</text>
    <text x="846" y="388" class="t s">26 replies not a code</text>
    <text x="846" y="408" class="t s">272 of 295 match the vote</text>

    <rect x="1022" y="288" width="170" height="134" rx="7" class="box"/>
    <text x="1034" y="308" class="t b" font-size="12.5">Llama dataset</text>
    <text x="1034" y="326" class="g" font-size="10">summary of its 445 codes</text>
    <text x="1034" y="348" class="t s">412 answered</text>
    <text x="1034" y="368" class="t s">28 left unanswered</text>
    <text x="1034" y="388" class="t s">20 not a code, 5 repeated</text>
    <text x="1034" y="408" class="t s">355 of 412 match the vote</text>
  </g>

  <!-- ===== Vote and comparison ===== -->
  <path d="M335,422 L335,446 L523,446" class="line"/>
  <path d="M711,422 L711,446 L523,446" class="line"/>
  <path d="M523,422 L523,466" class="flow"/>

  <rect x="238" y="470" width="570" height="62" rx="8" fill="#eef6f1" stroke="#a9d1bb"/>
  <text x="254" y="494" class="t b" font-size="14">Checked, then 2 of 3 must agree</text>
  <text x="254" y="514" class="t s">Every code answered once, only the six names. No majority: the deciders choose.</text>

  <path d="M523,532 L523,560" class="flow"/>

  <rect x="238" y="564" width="570" height="92" rx="8" fill="#ffffff" stroke="#1c2b3a" stroke-width="1.5"/>
  <text x="254" y="588" class="t b" font-size="14">Mapping file</text>
  <text x="352" y="588" class="t m">references/esrd-cause-categories.csv</text>
  <text x="254" y="608" class="t s">423 codes unanimous · 22 accepted 2 of 3 · 0 left for review</text>
  <rect x="250" y="618" width="546" height="26" rx="4" fill="#e6ebf2"/>
  <text x="258" y="635" class="t m b">2718Z</text>
  <text x="304" y="635" class="t s">Oxalosis → <tspan class="b">Other</tspan> (GPT and Claude); Gemini's <tspan class="odd">Hereditary</tspan> is outvoted</text>

  <path d="M919,422 L919,446 L1013,446" class="line"/>
  <path d="M1107,422 L1107,446 L1013,446" class="line"/>
  <path d="M1013,422 L1013,466" class="flow"/>

  <rect x="822" y="470" width="382" height="62" rx="8" fill="#f3f0f8" stroke="#c9bfdc"/>
  <text x="838" y="494" class="t b" font-size="14">Local-model report</text>
  <text x="838" y="514" class="t m">references/esrd-cause-local-models.csv</text>

  <path d="M808,610 L1013,610 L1013,536" class="flow" stroke-dasharray="5 4"/>
  <text x="836" y="584" class="g s">each local answer</text>
  <text x="836" y="600" class="g s">compared with the vote</text>

  <!-- ===== Legend ===== -->
  <text x="20" y="300" class="t b" font-size="12.5">Key</text>
  <path d="M22,322 L60,322" class="send"/>
  <text x="68" y="326" class="t s">request: codes</text>
  <text x="68" y="341" class="t s">and prompt</text>
  <path d="M22,362 L60,362" class="ret"/>
  <text x="68" y="366" class="t s">reply, as a dataset</text>
  <rect x="22" y="384" width="38" height="18" rx="3" fill="#e6ebf2"/>
  <text x="68" y="397" class="t s">a code the models split</text>
  <text x="22" y="424" class="s odd">Hereditary</text>
  <text x="90" y="424" class="t s">the outvoted answer</text>

  <text x="20" y="470" class="g" font-size="10.5">Three of the 445 rows shown.</text>
  <text x="20" y="485" class="g" font-size="10.5">Reasons not shown.</text>
  <text x="20" y="500" class="g" font-size="10.5">"Hereditary" is short for</text>
  <text x="20" y="515" class="g" font-size="10.5">Hereditary or polycystic</text>
  <text x="20" y="530" class="g" font-size="10.5">kidney disease.</text>
</svg>
